services:
  - type: web
    name: guardianpay-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: ENVIRONMENT
        value: production
      - key: SQLITE_DB_PATH
        value: /var/data/guardianpay.sqlite
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
    disk:
      name: guardianpay-data
      mountPath: /var/data
      sizeGB: 1
